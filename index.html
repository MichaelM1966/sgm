<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0f17">
<meta name="mobile-web-app-capable" content="yes">
<title>Familien-Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<!--
  FAMILIEN-DASHBOARD – Konzept (Kurzfassung)
  ------------------------------------------
  Zielgerät: Android-Tablet 10–11", Querformat, Wand/Ständer. Lesbar aus 2–3 m.
  Prinzip:   "Glance first" – die Startseite beantwortet im Vorbeigehen: Was ist heute/morgen?
             Was ziehen die Kinder an? Was gibt's zu essen? Wer hat seine Aufgaben?
  Navigation: Eine feste Seitenleiste mit 7 großen Kacheln, keine Untermenüs. Nach 3 Min. ohne
             Berührung springt die App automatisch zurück auf "Heute".
  Farben:    Jede Person hat eine feste Farbe (Kalender, Aufgaben, Pinnwand) – Kinder erkennen
             "ihre" Farbe ohne lesen zu müssen. Emojis als zweiter Erkennungskanal.
  Touch:     Mindestens 64 px Tap-Ziele, ganze Karten sind klickbar, Spracheingabe für Einkauf.
  Daten:     Alles im LocalStorage (Key "familyDash.v1"), Backup als JSON-Export/Import.
  Online:    Wetter über Open-Meteo (ohne API-Key). Alles andere funktioniert offline.
-->
<style>
:root{
  --bg:#0b0f17;--panel:#151b27;--panel2:#1e2636;--line:#2c3649;--text:#f4f7fc;--muted:#9fabc0;
  --accent:#ffd34d;--danger:#ff5d5d;--ok:#3ddc84;--radius:22px;--tap:64px
}
body.light{
  --bg:#edf1f7;--panel:#ffffff;--panel2:#f3f5fa;--line:#d5dce8;--text:#101827;--muted:#536077;--accent:#f2b705
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;font-size:20px;
  overscroll-behavior:none;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text;font-family:inherit}
button{font-family:inherit;cursor:pointer}
button:active,.tile:active{transform:scale(.97)}
.app{display:grid;grid-template-columns:116px 1fr;height:100vh;height:100dvh}

/* Seitenleiste */
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:10px 8px;gap:6px}
.rail button{flex:1;max-height:100px;border:0;border-radius:18px;background:transparent;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:15px;font-weight:700}
.rail button .ic{font-size:34px;line-height:1}
.rail button.active{background:var(--panel2);color:var(--text);box-shadow:inset 5px 0 0 var(--accent)}
.rail button.sos{background:#c62828;color:#fff;margin-top:auto;box-shadow:none}

main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:20px;padding:10px 22px;border-bottom:1px solid var(--line)}
.clock{font-size:56px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1}
.date{font-size:20px;color:var(--muted);line-height:1.25}
.date b{color:var(--text);display:block;font-size:24px}
.spacer{flex:1}
.wmini{font-size:32px;font-weight:800}
.iconbtn{width:var(--tap);height:var(--tap);border-radius:18px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:28px}
#view{flex:1;overflow:auto;padding:18px 22px;min-height:0}

/* Basis-Elemente */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;min-width:0}
.card h2{margin:0 0 12px;font-size:19px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;gap:10px}
.card h2 .act{margin-left:auto;text-transform:none;letter-spacing:0}
.clickable{cursor:pointer}
.btn{min-height:var(--tap);padding:0 22px;border-radius:16px;background:var(--panel2);color:var(--text);font-size:20px;font-weight:800;
  border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:#111;border-color:transparent}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.btn.sm{min-height:50px;padding:0 16px;font-size:17px}
.btn.wide{width:100%}
.chip{min-height:54px;padding:0 18px;border-radius:999px;border:2px solid var(--line);background:var(--panel2);color:var(--text);
  font-size:18px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.chip.on{background:var(--c,var(--accent));color:#111;border-color:transparent}
.chip.off{opacity:.35}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:18px;padding:8px 0}
.seg{display:inline-flex;background:var(--panel2);border-radius:18px;padding:5px;gap:4px;border:1px solid var(--line)}
.seg button{min-height:54px;padding:0 20px;border-radius:14px;border:0;background:transparent;color:var(--muted);font-size:18px;font-weight:800}
.seg button.on{background:var(--accent);color:#111}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.bar{height:14px;border-radius:9px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:9px;transition:width .4s}

/* Termine */
.ev{display:flex;gap:12px;background:var(--panel2);border-radius:14px;padding:10px 12px;border-left:9px solid var(--c);margin-bottom:8px;cursor:pointer}
.evt{font-weight:800;font-variant-numeric:tabular-nums;min-width:66px;font-size:19px}
.evtitle{font-weight:800;font-size:20px;line-height:1.2;overflow-wrap:anywhere;hyphens:auto}
.evwho{color:var(--c);font-size:16px;font-weight:800;margin-top:2px}
.ev.big .evt{font-size:24px;min-width:80px}.ev.big .evtitle{font-size:24px}.ev.big .evwho{font-size:18px}
.ev.sm{padding:8px 9px;border-left-width:7px;flex-direction:column;gap:2px}
.ev.sm .evt{font-size:15px;min-width:0}.ev.sm .evtitle{font-size:16px}.ev.sm .evwho{font-size:14px}
.alert{background:#7a4b00;color:#ffe9b3;border-radius:14px;padding:12px 14px;font-weight:800;margin-bottom:10px;font-size:20px}
body.light .alert{background:#ffe8b0;color:#5a3600}

/* Startseite */
.home{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.daylabel{font-size:26px;font-weight:800;margin:4px 0 10px}
.wbig{display:flex;align-items:center;gap:16px}
.wbig .e{font-size:76px;line-height:1}
.wbig .t{font-size:56px;font-weight:800;line-height:1}
.tips{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.tip{display:flex;align-items:center;gap:12px;background:var(--panel2);border-radius:14px;padding:10px 12px;font-size:20px;font-weight:700}
.tip span{font-size:34px}
.kidrow{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.kidrow .av{font-size:38px}
.kidrow .grow{flex:1}
.mini{font-size:16px;color:var(--muted);font-weight:700}

/* Kalender */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px;min-height:470px;display:flex;flex-direction:column}
.day.today{outline:4px solid var(--accent)}
.dayhead{font-weight:900;font-size:20px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.dayhead small{color:var(--muted);font-size:16px}
.addday{margin-top:auto;min-height:52px;border-radius:14px;border:2px dashed var(--line);background:transparent;color:var(--muted);font-size:26px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* Essen */
.plan{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.pday{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;min-height:200px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;cursor:pointer}
.pday.today{outline:4px solid var(--accent)}
.pday .e{font-size:56px}
.pday .n{font-weight:800;font-size:18px;line-height:1.2}
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.rc{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.rc .e{font-size:52px}
.rimg{width:100%;height:130px;object-fit:cover;border-radius:14px;display:block}
.rimg+.e{display:none}
.rimg.big{height:220px;margin-bottom:14px}
.rc .n{font-weight:800;font-size:21px;line-height:1.2}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:14px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--panel2);color:var(--muted)}
.score{font-weight:800;color:var(--ok)}
.ing{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:20px}

/* Aufgaben */
.kids{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.kid{border-top:10px solid var(--c)}
.kidhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.kidhead .av{font-size:58px;line-height:1}
.kidhead .nm{font-size:30px;font-weight:900}
.stats{display:flex;gap:14px;font-size:22px;font-weight:800}
.chore{display:flex;align-items:center;gap:14px;min-height:86px;padding:12px 16px;border-radius:18px;background:var(--panel2);
  border:3px solid transparent;width:100%;text-align:left;color:var(--text);font-size:22px;font-weight:800;margin-bottom:10px;position:relative}
.chore .em{font-size:42px}
.chore .pts{font-size:15px;color:var(--muted);font-weight:800}
.chore .ck{margin-left:auto;width:56px;height:56px;flex:none;border-radius:50%;border:4px solid var(--line);display:grid;place-items:center;font-size:32px}
.chore.done{border-color:var(--c);background:color-mix(in srgb,var(--c) 20%,var(--panel2))}
.chore.done .ck{background:var(--c);border-color:var(--c);color:#111}
.chore.done .tt{text-decoration:line-through;opacity:.75}
.reward{background:var(--panel2);border-radius:16px;padding:12px;margin-bottom:14px}
.x{position:absolute;top:-10px;right:-10px;width:46px;height:46px;border-radius:50%;background:var(--danger);color:#fff;border:0;font-size:22px;font-weight:900;z-index:2}

/* Einkauf */
.shopin{display:flex;gap:10px;margin-bottom:12px}
.shopin input{flex:1}
.shopcols{columns:3 300px;column-gap:16px}
.shopcols .card{break-inside:avoid;margin-bottom:16px;display:inline-block;width:100%}
.item{display:flex;align-items:center;gap:12px;min-height:62px;padding:4px 6px;border-radius:12px;font-size:22px;font-weight:700;cursor:pointer}
.item .box{width:42px;height:42px;flex:none;border-radius:11px;border:3px solid var(--line);display:grid;place-items:center;font-size:24px}
.item.done{opacity:.45}.item.done .nm{text-decoration:line-through}
.item .del{margin-left:auto;width:48px;height:48px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-size:22px}

/* Pinnwand */
.board{display:grid;grid-template-columns:1fr 1.5fr;gap:16px;align-items:start}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.note{background:color-mix(in srgb,var(--c) 22%,var(--panel));border:2px solid var(--c);border-radius:18px;padding:14px;position:relative;min-height:120px}
.note .who{font-weight:900;color:var(--c);font-size:18px}
.note .txt{font-size:23px;font-weight:800;margin:6px 0;line-height:1.25;word-break:break-word}
.note .when{font-size:15px;color:var(--muted)}
.note audio{width:100%;margin-top:6px}
.qs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qs .btn{justify-content:flex-start;font-size:18px;padding:0 14px}
.rem{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);position:relative}
.rem .e{font-size:34px}
.rem>div{flex:1;min-width:0;overflow-wrap:anywhere;hyphens:auto}
.rem .when{margin-left:auto;font-weight:900;white-space:nowrap;flex:none}
.card h2 .act .btn{white-space:nowrap}
.rem .when.soon{color:var(--danger)}
.rec{background:var(--danger)!important;color:#fff!important;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}

/* Kontakte */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:180px;border-radius:22px;background:var(--panel);
  border:2px solid var(--line);color:var(--text);text-decoration:none;font-size:24px;font-weight:900;position:relative;text-align:center;padding:10px}
.tile .em{font-size:58px}
.tile .ph{font-size:19px;color:var(--muted);font-weight:700}
.tile.sos{background:#b71c1c;border-color:#ff5252;color:#fff}
.tile.sos .ph{color:#ffd6d6}

/* Modal, Formulare */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.hidden{display:none}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:22px 26px;width:min(900px,100%);max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 16px;font-size:28px}
.field{margin-bottom:16px}
.field>label{display:block;color:var(--muted);font-size:15px;font-weight:800;margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em}
.in{width:100%;min-height:62px;border-radius:14px;border:2px solid var(--line);background:var(--panel2);color:var(--text);font-size:21px;padding:10px 14px}
textarea.in{min-height:120px}
.in:focus{outline:none;border-color:var(--accent)}
.actions{display:flex;gap:12px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.actions .left{margin-right:auto}
.mrow{display:grid;grid-template-columns:90px 1fr 90px;gap:10px;margin-bottom:8px}
input[type=color].in{padding:4px;height:62px}


/* 3-Tage-Vorschau */
.fc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.fcd{background:var(--panel2);border-radius:16px;padding:8px;text-align:center}
.fcl{font-weight:800;font-size:16px}.fce{font-size:34px;line-height:1.2}.fct{font-size:19px}
.ev.sm2{padding:7px 10px}.ev.sm2 .evt{font-size:16px;min-width:56px}.ev.sm2 .evtitle{font-size:17px}.ev.sm2 .evwho{font-size:14px}
/* ===== Design „Bunt“ (jugendlich) ===== */
body.fun{
  --bg:#130d2e;--panel:rgba(255,255,255,.07);--panel2:rgba(255,255,255,.10);--line:rgba(255,255,255,.13);
  --text:#ffffff;--muted:#c3bcef;--accent:#ffc93c;--radius:28px;--grad:linear-gradient(135deg,#ff4fa0 0%,#ff9a3c 100%);
  --grad2:linear-gradient(135deg,#7c3aed 0%,#ec4899 100%);
  font-family:"Nunito","Quicksand",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(1100px 650px at 0% -10%,#5b21b6 0%,transparent 60%),
             radial-gradient(900px 600px at 105% 0%,#be185d 0%,transparent 55%),
             radial-gradient(1000px 700px at 50% 125%,#0e7490 0%,transparent 60%),#130d2e;
  background-attachment:fixed}
body.fun.light{
  --bg:#fbf5ff;--panel:rgba(255,255,255,.78);--panel2:rgba(255,255,255,.95);--line:rgba(124,58,237,.16);
  --text:#2a1650;--muted:#7a68a8;--accent:#ff4fa0;
  background:radial-gradient(1100px 650px at 0% -10%,#e9d5ff 0%,transparent 60%),
             radial-gradient(900px 600px at 105% 0%,#fbcfe8 0%,transparent 55%),
             radial-gradient(1000px 700px at 50% 125%,#bae6fd 0%,transparent 60%),#fbf5ff}
body.fun .rail{background:rgba(0,0,0,.18);border-right:0}
body.fun.light .rail{background:rgba(255,255,255,.55)}
body.fun .rail button{border-radius:22px}
body.fun .rail button.active{background:var(--grad2);color:#fff;box-shadow:0 8px 22px rgba(236,72,153,.35)}
body.fun .rail button.sos{background:linear-gradient(135deg,#ef4444,#f97316)}
body.fun .topbar{border-bottom:0}
body.fun .clock{background:linear-gradient(90deg,#ffd166,#ff5fa2 55%,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
body.fun .date b{font-weight:900}
body.fun .card{border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.18)}
body.fun .card h2{color:var(--muted);letter-spacing:.05em;font-weight:900}
body.fun .btn{border-radius:18px;font-weight:800}
body.fun .btn.primary,body.fun .seg button.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(255,79,160,.3)}
body.fun .chip{border-width:2px}
body.fun .chip.on:not([style*="--c"]){background:var(--grad);color:#fff}
body.fun .chip.on[style*="--c"]{color:#1a1033;box-shadow:0 4px 14px color-mix(in srgb,var(--c) 45%,transparent)}
body.fun .ev{border-radius:18px;border-left-width:0;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 30%,transparent),var(--panel2) 60%);box-shadow:inset 6px 0 0 var(--c)}
body.fun .kid{border-top:0;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 32%,transparent) 0%,var(--panel) 45%)}
body.fun .kidhead .nm{font-weight:900}
body.fun .chore{border-radius:22px}
body.fun .chore.done .ck{animation:pop .45s ease}
body.fun .bar{height:16px}
body.fun.light .bar{background:rgba(124,58,237,.12)}
body.fun .bar i{background:linear-gradient(90deg,var(--c,#ff4fa0),color-mix(in srgb,var(--c,#ffb03b) 60%,#fff))}
body.fun .alert{background:var(--grad);color:#fff;border-radius:18px}
body.fun .note{border-radius:22px;transform:rotate(-.6deg)}
body.fun .note:nth-child(even){transform:rotate(.7deg)}
body.fun .pday,body.fun .rc,body.fun .day{border-radius:24px}
body.fun .tile{border-radius:26px}
body.fun .tile.sos{background:linear-gradient(135deg,#dc2626,#f97316);border-color:transparent}
body.fun .sheet{background:#1e1545;border-color:rgba(255,255,255,.15);border-radius:30px}
body.fun.light .sheet{background:#fff}
body.fun .line,body.fun .tag{border-radius:999px}
body.fun .wbig .t{font-weight:900}
body.fun .tip{border-radius:16px}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(150px);background:var(--text);color:var(--bg);padding:16px 26px;
  border-radius:16px;font-size:21px;font-weight:800;z-index:70;transition:transform .3s;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;top:-60px;font-size:38px;pointer-events:none;z-index:60;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(600deg)}}

@media (max-width:1100px){.home{grid-template-columns:1fr 1fr}.home .col:first-child{grid-column:1/-1}.board{grid-template-columns:1fr}}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .rail{flex-direction:row;order:2;border-right:0;border-top:1px solid var(--line);overflow-x:auto}
  .rail button{min-width:76px}.rail button.sos{margin-top:0}
  .home,.two,.kids{grid-template-columns:1fr}
  .week,.plan{grid-template-columns:1fr}.day{min-height:0}
  .clock{font-size:40px}
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail">
    <button data-a="go" data-v="home"><span class="ic">🏠</span>Heute</button>
    <button data-a="go" data-v="cal"><span class="ic">📅</span>Kalender</button>
    <button data-a="go" data-v="food"><span class="ic">🍽️</span>Essen</button>
    <button data-a="go" data-v="chores"><span class="ic">⭐</span>Aufgaben</button>
    <button data-a="go" data-v="shop"><span class="ic">🛒</span>Einkauf</button>
    <button data-a="go" data-v="board"><span class="ic">📌</span>Pinnwand</button>
    <button data-a="go" data-v="sos" class="sos"><span class="ic">🆘</span>Notfall</button>
  </nav>
  <main>
    <header class="topbar">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
      <div id="syncDot" class="mini" title="Synchronisation"></div>
      <div class="spacer"></div>

    sharedKeys().forEach(k => { if (before[k] !== srv.base[k]) { patch[k] = S[k]; if (srv.base[k] !== undefined) base[k] = JSON.parse(srv.base[k]); dirty = true; } });
    Object.keys(srv.base).forEach(k => { if (!(k in before) && !LOCAL_KEYS.includes(k)) { patch[k] = null; dirty = true; } });
    if (dirty) {
      const r = await fetch('api.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ patch, base }) });
      const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status);
      adopt(j.data, j.version, before); changed = true;
    } else if (!changed) {
      const j = await (await fetch('api.php?since=' + srv.version, { cache: 'no-store' })).json();
      if (j.error) throw new Error(j.error);
      if (!j.unchanged && j.data) { adopt(j.data, j.version, before); changed = true; }
    }
    setOnline(true);
    if (changed) softRefresh();
  } catch (e) { console.warn('Sync', e); setOnline(false); }
  finally { srv.busy = false; if (srv.again) setTimeout(syncNow, 50); }
}

   Kalender-Logik
   ========================================================= */
function eventsOn(ds) {
  const day = parse(ds);
  return S.events.filter(e => {
    if ((e.skip || []).includes(ds)) return false;
    if (e.date === ds) return true;
    if (!e.repeat || e.repeat === 'none') return false;
    const diff = Math.round((day - parse(e.date)) / 864e5);
    if (diff < 0) return false;
    if (e.until && ds > e.until) return false;
    if (e.repeat === 'daily') return true;
    if (e.repeat === 'yearly') { const s = parse(e.date); return day.getMonth() === s.getMonth() && day.getDate() === s.getDate(); }
    if (e.repeat === 'monthlyNth') {
      if (day.getDay() !== e.wd) return false;
      return e.nth > 0 ? Math.ceil(day.getDate() / 7) === e.nth : day.getDate() + 7 > new Date(day.getFullYear(), day.getMonth() + 1, 0).getDate();
    }
    if (e.repeat === 'weekly') return diff % 7 === 0;
    if (e.repeat === 'biweekly') return diff % 14 === 0;
    if (e.repeat === 'monthly') return day.getDate() === parse(e.date).getDate();
    return false;
  }).sort((a, b) => (a.time || '00:00').localeCompare(b.time || '00:00'));
}
function evHTML(e, ds, size = '') {
  const m = M(e.who), c = CATS[e.cat] || CATS.other;
  return `<div class="ev ${size}" style="--c:${m.color}" data-a="editEvent" data-id="${e.id}" data-d="${ds}">
    <div class="evt">${e.time ? esc(e.time) : 'Ganztags'}</div>
    <div><div class="evtitle">${c.i} ${esc(e.title)}</div><div class="evwho">${m.emoji} ${esc(m.name)}${e.repeat && e.repeat !== 'none' ? ' · 🔁' : ''}${e.src ? ' · 📥' : ''}</div></div></div>`;
}

const wc = c => WC[c] || ['🌡️', '–'];
async function fetchWeather(force) {
  if (!force && S.weather.data && Date.now() - S.weather.ts < 30 * 6e4) return;
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${S.loc.lat}&longitude=${S.loc.lon}` +
      `&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m` +
      `&hourly=temperature_2m,precipitation_probability,weather_code` +
      `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max` +
      `&timezone=auto&forecast_days=3`;
    const r = await fetch(u);
    if (!r.ok) throw new Error(r.status);
    S.weather = { ts: Date.now(), data: await r.json() };
    save(); softRefresh();
  } catch (e) { console.warn('Wetter nicht erreichbar', e); }
}
function clothing() {
  const d = S.weather.data; if (!d || !d.hourly) return null;
  const td = today();
  const hs = d.hourly.time.map((t, i) => ({ t, i })).filter(o => o.t.startsWith(td) && +o.t.slice(11, 13) >= 7 && +o.t.slice(11, 13) <= 17);
  const temps = hs.map(o => d.hourly.temperature_2m[o.i]);
  const rain = Math.max(0, ...hs.map(o => d.hourly.precipitation_probability[o.i] ?? 0));
  const codes = hs.map(o => d.hourly.weather_code[o.i]);
  const tMin = temps.length ? Math.min(...temps) : d.current.temperature_2m;
  const tMax = temps.length ? Math.max(...temps) : d.current.temperature_2m;
  const tips = [];
  if (tMin < 0) tips.push(['🧤', 'Winterjacke, Mütze, Schal & Handschuhe']);
  else if (tMin < 7) tips.push(['🧥', 'Warme Jacke & Mütze']);
  else if (tMin < 13) tips.push(['🧥', 'Übergangsjacke']);
  else if (tMin < 19) tips.push(['👕', 'Pulli oder Langarmshirt']);
  else tips.push(['🩳', 'T-Shirt & kurze Hose']);
  if (codes.some(c => [71, 73, 75, 77, 85, 86].includes(c))) tips.push(['⛄', 'Schneehose & Winterstiefel']);
  else if (rain >= 50) tips.push(['☔', 'Regenjacke & Gummistiefel']);
  else if (rain >= 25) tips.push(['🌂', 'Regenjacke einpacken']);
  if (codes.some(c => [56, 57, 66, 67].includes(c)) || tMin < -1) tips.push(['⚠️', 'Vorsicht Glätte auf dem Schulweg']);
  if (tMax - tMin >= 8) tips.push(['🧅', 'Zwiebellook – morgens kalt, mittags warm']);
  if ((d.daily?.uv_index_max?.[0] ?? 0) >= 6 || tMax >= 26) tips.push(['🧢', 'Sonnencreme & Kappe']);
  if (tMax >= 25) tips.push(['💧', 'Volle Trinkflasche mitnehmen']);
  return { tips, tMin, tMax, rain };
}

   Aufgaben-Logik
   ========================================================= */
function choresFor(kid, ds) { const wd = parse(ds).getDay(); return S.chores.filter(c => c.kid === kid && (!c.days || c.days.includes(wd))); }
const isDone = (ds, id) => !!S.done[ds + '|' + id];
function streak(kid) {
  let d = new Date(), n = 0;
  const tl = choresFor(kid, ymd(d));
  if (tl.length && tl.every(c => isDone(ymd(d), c.id))) n = 1;
  d = addDays(d, -1);
  for (let i = 0; i < 365; i++) {
    const ds = ymd(d), l = choresFor(kid, ds);
    if (l.length) { if (l.every(c => isDone(ds, c.id))) n++; else break; }
    d = addDays(d, -1);
  }
  return n;
}

function addToShop(name, cat) {
  name = name.trim(); if (!name) return false;
  if (S.shop.some(s => !s.done && norm(s.name) === norm(name))) return false;
  S.shop.push({ id: uid(), name: name[0].toUpperCase() + name.slice(1), cat: cat || guessCat(name), done: false, ts: Date.now() });
  return true;
}
const onList = name => S.shop.some(s => !s.done && matchIng(name, [s.name]));
const ALWAYS = ['Salz', 'Pfeffer', 'Wasser'];   // wird nie auf die Einkaufsliste gesetzt
function missingFor(r) { return r.ingredients.filter(i => !matchIng(i.name, S.pantry) && !matchIng(i.name, ALWAYS) && !onList(i.name)); }
function weekMissing() {
  const start = monday(addDays(new Date(), ui.foodWeek * 7)), need = new Map();
  for (let i = 0; i < 7; i++) {
    const ds = ymd(addDays(start, i)); if (ds < today()) continue;
    const r = R(S.meals[ds]); if (!r) continue;
    missingFor(r).forEach(ing => { if (!need.has(norm(ing.name))) need.set(norm(ing.name), ing); });
  }
  return [...need.values()];
}
function recipeMatches(r) {
  if (ui.recipeFilter !== 'all' && !r.tags.includes(ui.recipeFilter)) return false;
  if (ui.recipeSearch && !norm(r.name + ' ' + r.ingredients.map(i => i.name).join(' ')).includes(norm(ui.recipeSearch))) return false;

}

function nextOcc(r) {
  if (!r.yearly) return r.date;
  const d = parse(r.date), t = parse(today());
  let n = new Date(t.getFullYear(), d.getMonth(), d.getDate());
  if (n < t) n = new Date(t.getFullYear() + 1, d.getMonth(), d.getDate());
  return ymd(n);
}

function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y) / 864e5 + 1) / 7);
}

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }
function confetti(emojis = ['🎉', '⭐', '🌟', '🎈', '✨', '🏆']) {
  for (let i = 0; i < 36; i++) {
    const s = document.createElement('span'); s.className = 'confetti';
    s.textContent = emojis[i % emojis.length];
    s.style.left = Math.random() * 100 + 'vw'; s.style.animationDuration = (1.6 + Math.random() * 1.6) + 's'; s.style.animationDelay = Math.random() * .4 + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 3800);
  }
}
function dictate(cb) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Spracheingabe wird von diesem Browser nicht unterstützt'); return; }
  const r = new SR(); r.lang = 'de-DE'; r.interimResults = false;
  r.onresult = e => cb(e.results[0][0].transcript);
  r.onerror = () => toast('Nicht verstanden – bitte nochmal');
  r.start(); toast('🎤 Sprich jetzt …');
}
function addShopText(txt) {

}
let recorder = null;
async function toggleRecord() {
  if (recorder) { recorder.stop(); return; }
  try {
    const st = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = []; recorder = new MediaRecorder(st);
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
      st.getTracks().forEach(t => t.stop());

let subSyncing = false;
async function syncSubs(force) {
  if (!SERVER || subSyncing) return;
  const due = S.subs.filter(s => s.url && (force || !s.last || Date.now() - s.last > 30 * 6e4));
  if (!due.length) return;
  subSyncing = true;
  for (const sub of due) {
    try {
      const r = await fetch('fetch.php?url=' + encodeURIComponent(sub.url), { cache: 'no-store' });
      const t = await r.text();
      if (!r.ok) throw new Error(t.slice(0, 100) || 'HTTP ' + r.status);
      if (!t.includes('BEGIN:VCALENDAR')) throw new Error('Keine Kalenderdaten – Link prüfen');
      const evs = icsToEvents(t, sub.who, sub.cat).map((e, i) => ({ ...e, id: sub.id + ':' + i, src: sub.id }));
      S.events = S.events.filter(e => e.src !== sub.id).concat(evs);
      Object.assign(sub, { last: Date.now(), count: evs.length, err: '' });
    } catch (e) { sub.err = e.message; sub.last = Date.now() - 25 * 6e4; }   // in 5 Min. erneut versuchen
  }
  subSyncing = false;
  save(); if (ui.modal && ui.modal.isAbo) renderModal(); else softRefresh();
}

        <ol style="line-height:1.55">
          <li>Einmalig: Am PC <b>calendar.google.com</b> öffnen → beim Kalender ⋮ → <b>Einstellungen und Freigabe</b> → „Kalender integrieren“ → <b>Privatadresse im iCal-Format</b> kopieren.</li>

          <li>Zum Aktualisieren: Lesezeichen antippen → Chrome lädt die <b>.ics-Datei</b> herunter → hier bei der Quelle auf <b>↻ Neu</b> tippen und die Datei aus „Downloads“ wählen.</li>

  doImport: () => {

    openModal(() => `<h3>⚙️ Einstellungen</h3>
      ${field('Familie (Emoji · Name · Farbe)', S.members.map(m => `<div class="mrow"><input class="in" data-m="${m.id}" data-mf="emoji" value="${esc(m.emoji)}"><input class="in" data-m="${m.id}" data-mf="name" value="${esc(m.name)}"><input class="in" type="color" data-m="${m.id}" data-mf="color" value="${m.color}"></div>`).join(''))}
      ${field('Wetter-Ort', `<div class="shopin"><input class="in" data-f="locName" value="${esc(ui.form.locName)}"><button class="btn" data-a="locSearch">🔍 Suchen</button></div><div class="mini">Aktuell: ${esc(ui.form.loc.name)} (${ui.form.loc.lat.toFixed(2)}, ${ui.form.loc.lon.toFixed(2)})</div>`)}
      ${field('Design', `<div class="row"><button class="chip ${(S.design || 'fun') === 'fun' ? 'on' : ''}" data-a="setDesign" data-v="fun">🎨 Bunt</button><button class="chip ${S.design === 'classic' ? 'on' : ''}" data-a="setDesign" data-v="classic">🧊 Klassisch</button><span class="mini">Hell/Dunkel wechselst du oben mit 🌓</span></div>`)}
      ${field('Anzeigegröße (nur dieses Gerät)', `<div class="row">${[[0.7, 'XS'], [0.8, 'S'], [0.85, 'M'], [0.95, 'L'], [1.05, 'XL']].map(([z, l]) => `<button class="chip ${(S.scale || 0.85) === z ? 'on' : ''}" data-a="setScale" data-v="${z}">${l} · ${Math.round(z * 100)} %</button>`).join('')}</div>`)}
      ${field('Tablet', `<div class="row"><button class="chip ${S.wake ? 'on' : ''}" data-a="toggleWake">💡 Bildschirm immer an</button><button class="chip" data-a="fullscreen">⛶ Vollbild</button></div>`)}
      ${field('Daten', `<div class="row"><button class="btn sm" data-a="exportData">💾 Backup herunterladen</button><label class="btn sm">📂 Backup laden<input type="file" accept=".json" id="backupFile" style="display:none"></label><button class="btn sm danger" data-a="resetData">↺ Demo-Daten zurücksetzen</button></div>`)}
      <div class="actions"><button class="btn" data-a="close">Abbrechen</button><button class="btn primary" data-a="saveSettings">Speichern</button></div>`);
  },
  locSearch: async () => {
    try {
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(ui.form.locName)}&count=1&language=de`);
      const j = await r.json(); const g = j.results && j.results[0];
      if (!g) { toast('Ort nicht gefunden'); return; }
      ui.form.loc = { name: g.name, lat: g.latitude, lon: g.longitude }; ui.form.locName = g.name; renderModal(); toast(`📍 ${g.name}${g.admin1 ? ', ' + g.admin1 : ''}`);
    } catch (e) { toast('Ortssuche nicht erreichbar (offline?)'); }
  },
  saveSettings: () => {
    document.querySelectorAll('[data-m]').forEach(el => { const m = S.members.find(x => x.id === el.dataset.m); if (m && el.value.trim()) m[el.dataset.mf] = el.value.trim(); });
    const locChanged = ui.form.loc.lat !== S.loc.lat || ui.form.loc.lon !== S.loc.lon;
    S.loc = ui.form.loc;
    save(); closeModal(); render(); toast('✅ Gespeichert');
    if (locChanged) fetchWeather(true);
  },
  setDesign: d => { S.design = d.v; save(); renderTop(); renderModal(); },
  setScale: d => { S.scale = +d.v; save(); applyScale(); renderModal(); },
  toggleWake: () => { S.wake = !S.wake; save(); renderModal(); requestWake(); },
  fullscreen: () => {
    const d = document, el = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else { const r = (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el, { navigationUI: 'hide' }); if (r && r.catch) r.catch(() => toast('Vollbild wird von diesem Browser nicht unterstützt')); }
  },
  exportData: () => { const c = { ...S }; download(`familien-dashboard-${today()}.json`, JSON.stringify(c, null, 1)); },
  resetData: () => { if (!confirmTwice('reset')) return; S = seed(); normalize(); save(); closeModal(); render(); fetchWeather(true); toast('Demo-Daten wiederhergestellt'); }
};
function choreModal(id, kid) {
  const c = id ? S.chores.find(x => x.id === id) : null;
  ui.form = c ? { ...c, pts: String(c.pts), days: c.days ? [...c.days] : [0, 1, 2, 3, 4, 5, 6], _id: id } : { kid, title: '', emoji: '⭐', pts: '2', days: [0, 1, 2, 3, 4, 5, 6] };
  openModal(() => `<h3>${id ? 'Aufgabe bearbeiten' : 'Neue Aufgabe'}</h3>
    ${field('Für', pickRow('kid', kids().map(k => [k.id, `${k.emoji} ${esc(k.name)}`, k.color])))}
    <div class="mrow" style="grid-template-columns:110px 1fr 140px">${field('Emoji', inp('emoji'))}${field('Aufgabe', inp('title', 'z. B. Tisch decken'))}${field('Punkte', inp('pts', '', 'number'))}</div>
    ${field('An welchen Tagen?', multiRow('days', [1, 2, 3, 4, 5, 6, 0].map(i => [i, WD[i]]), true))}
    <div class="row mini">Ideen: 🍴 Tisch decken · 🎒 Schultasche packen · 🐶 Haustier füttern · 🧺 Wäsche sortieren · 🗑️ Müll rausbringen · 🛏️ Bett machen</div>
    <div class="actions"><button class="btn" data-a="close">Abbrechen</button><button class="btn primary" data-a="saveChore">Speichern</button></div>`);
}
/* Schutz vor versehentlichem Löschen: zweimal tippen */
function confirmTwice(key) {
  if (confirmTwice.k === key && Date.now() - confirmTwice.t < 3000) { confirmTwice.k = null; return true; }
  confirmTwice.k = key; confirmTwice.t = Date.now(); toast('Zum Bestätigen nochmal tippen'); return false;
}

/* =========================================================
   Event-Verkabelung
   ========================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  if (el.tagName === 'BUTTON' || el.closest('.item')) e.stopPropagation();
  const fn = A[el.dataset.a]; if (fn) fn(el.dataset, el, e);
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('input', e => {
  const f = e.target.dataset.f; if (f && ui.form) ui.form[f] = e.target.value;
  if (e.target.id === 'recipeSearch') { ui.recipeSearch = e.target.value; $('#recipeGrid').innerHTML = recipeGrid(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset.enter) { e.preventDefault(); A[e.target.dataset.enter]?.(e.target.dataset, e.target, e); }
  if (e.key === 'Escape') closeModal();
});
document.addEventListener('change', e => {
  if (e.target.id === 'backupFile' && e.target.files[0]) {
    const fr = new FileReader();
    fr.onload = () => { try { let s = JSON.parse(String(fr.result).replace(/^<\?php exit; \?>\s*/, '')); if (s.data && s.data.members) s = s.data; if (!s.members || !s.events) throw 0; const w = S.weather; S = s; S.weather = w; normalize(); save(); closeModal(); render(); toast('✅ Backup geladen'); } catch (err) { toast('⚠️ Ungültige Backup-Datei'); } };
    fr.readAsText(e.target.files[0]);
  }
});

/* Bildschirm anlassen (Wake Lock) */
let wakeLock = null;
async function requestWake() {
  try {
    if (S.wake && 'wakeLock' in navigator && document.visibilityState === 'visible') wakeLock = await navigator.wakeLock.request('screen');
    else if (!S.wake && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { /* braucht eine Nutzer-Geste / HTTPS */ }
}
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => {
  const on = !!(document.fullscreenElement || document.webkitFullscreenElement);
  const b = $('#fsBtn'); if (b) { b.textContent = on ? '✕' : '⛶'; b.title = on ? 'Vollbild beenden' : 'Vollbild'; }
}));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { requestWake(); fetchWeather(); syncNow(); softRefresh(); } });

/* Nach 3 Minuten ohne Berührung zurück zur Startseite */
let idleT;
function resetIdle() {
  clearTimeout(idleT);
  idleT = setTimeout(() => { if (ui.view !== 'home' && $('#modal').classList.contains('hidden') && !ui.recording) { ui.choreEdit = false; ui.contactEdit = false; ui.view = 'home'; render(); } }, 3 * 60e3);
}
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => { resetIdle(); if (S.wake && !wakeLock) requestWake(); }, { passive: true }));

/* Start */
render(); resetIdle(); fetchWeather();
if (SERVER) {
  syncNow().then(() => syncSubs());
  setInterval(syncNow, 10e3);                 // alle 10 Sekunden abgleichen
  setInterval(() => syncSubs(), 5 * 6e4);     // Kalender-Abos prüfen
  window.addEventListener('online', syncNow);
}
/* Android „Teilen“: …/?rezept=https://www.chefkoch.de/… */
(() => {
  const u = new URLSearchParams(location.search).get('rezept');
  if (!u || !SERVER) return;
  history.replaceState(null, '', location.pathname);
  ui.view = 'food'; ui.foodTab = 'recipes'; render(); importRecipeModal(u); A.usePaste();
})();
/* Lesezeichen „Zum Dashboard ➜“ übergibt das Rezept im Link: …#rezept={…} */
(() => {
  if (!location.hash.startsWith('#rezept=')) return;
  try {
    const d = JSON.parse(decodeURIComponent(location.hash.slice(8)));
    history.replaceState(null, '', location.pathname);
    ui.view = 'food'; ui.foodTab = 'recipes'; render();
    recipeForm(recipeFromLD(d, safeUrl(d.url) ? d.url : ''));
  } catch (e) { toast('⚠️ Rezept konnte nicht übernommen werden'); }
})();
let lastDay = today();
setInterval(() => {
  if (today() !== lastDay) { lastDay = today(); render(); }   // Mitternacht: neuer Tag
  softRefresh();
}, 30e3);
setInterval(() => fetchWeather(), 30 * 6e4);
</script>
</body>
</html>
